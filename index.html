            <input type="text" id="email" placeholder="john@example.com" />

            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="555-555-5555" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="johndoe42" />
          </div>
          <div class="field">
            <label for="domain">Domain / Company</label>
            <input type="text" id="domain" placeholder="acme.com" />
          </div>
        </div>
      </details>
